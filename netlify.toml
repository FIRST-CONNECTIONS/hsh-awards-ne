# netlify.toml
# Netlify configuration for NE High Street Heroes Awards
 
[build]
  publish = "."
  functions = "netlify/functions"
 
[functions]
  node_bundler = "esbuild"
 
# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
 
# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean-URL routing for the single-page app.
# Each page path is rewritten (status 200, no redirect) to index.html so that
# /brand-kit, /about, etc. can be shared and deep-linked. The SPA reads the
# path on load and shows the matching page. Existing files (images, sitemap,
# functions) are served directly and take precedence over these rules.
[[redirects]]
  from = "/categories"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/vote"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/brand-kit"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

# Hidden sponsor page — deep-linkable but not in the nav or sitemap
[[redirects]]
  from = "/sponsor"
  to = "/index.html"
  status = 200
