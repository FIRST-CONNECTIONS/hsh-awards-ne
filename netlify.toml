# netlify.toml
# Netlify configuration for NE High Street Heroes Awards

[build]
  publish = "."
  functions = "netlify/functions"
  # Generates one static HTML file per SPA route, see prerender.js
  command = "node prerender.js"

[functions]
  node_bundler = "esbuild"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # 'unsafe-inline' is unavoidable: inline <style>, inline <script> and inline
    # onclick handlers throughout. Everything else is same-origin.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests"

# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML pages with revalidation.
# Header rules match the REQUEST path, so each clean URL needs its own rule —
# "/*.html" never matches "/about", even though it is served from about.html.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/categories"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/vote"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/about"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/brand-kit"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/contact"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sponsor"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/privacy-policy"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Clean-URL routing for the single-page app.
# Each path is rewritten (status 200, no redirect) to its prerendered file so it
# can be deep-linked with the right meta tags already in the markup. The SPA
# reads the path on load. Existing files take precedence over these rules.
[[redirects]]
  from = "/categories"
  to = "/categories.html"
  status = 200

[[redirects]]
  from = "/vote"
  to = "/vote.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/brand-kit"
  to = "/brand-kit.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

# Hidden sponsor page — deep-linkable but not in the nav or sitemap
[[redirects]]
  from = "/sponsor"
  to = "/sponsor.html"
  status = 200
